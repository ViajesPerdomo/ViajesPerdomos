<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Viajes Perdomo - Agencia de Viajes Nacionales en Cuba con guaguas Yutong" />
  <title>Viajes Perdomo · Reserva tu guagua</title>

  <style>
    /* ---------- Reset & Variables ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #14b8a6;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 0.85rem 1rem; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.25rem; font-weight: 800; }
    nav button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 0.45rem 0.85rem; border-radius: 999px; cursor: pointer; font-weight: 600; }
    nav button.active { background: white; color: var(--primary); }

    /* ---------- Hero ---------- */
    .hero { background: var(--primary-dark); color: white; padding: 2rem 1rem 3.5rem; text-align: center; }
    .hero h1 { font-size: clamp(1.5rem, 6vw, 2.6rem); font-weight: 800; margin-bottom: 0.5rem; }
    .hero p { font-size: 1rem; opacity: 0.9; margin-bottom: 1.5rem; }

    /* ---------- Buscador ---------- */
    .search-box { background: white; border-radius: var(--radius); padding: 0.9rem; max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field label { font-size: 0.68rem; font-weight: 700; color: var(--muted); }
    .field input, .field select { border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem; font-size: 0.9rem; width: 100%; }
    .search-box button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 0.65rem; font-weight: 700; cursor: pointer; grid-column: 1 / -1; height: 42px; }

    /* ---------- Main ---------- */
    main { max-width: 1200px; margin: -1.5rem auto 0; padding: 0 1rem 2.5rem; width: 100%; flex: 1; }
    .filters { display: flex; gap: 0.4rem; overflow-x: auto; margin-bottom: 1rem; }
    .chip { background: white; border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.8rem; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--primary); color: white; }

    /* ---------- Tarjetas ---------- */
    .trips-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    .trip-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .trip-img { height: 140px; background-size: cover; background-position: center; position: relative; padding: 0.6rem; display: flex; justify-content: space-between; align-items: flex-start; }
    .trip-price { background: var(--accent); color: white; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 999px; }
    .badge-guagua { position: absolute; bottom: 0.6rem; left: 0.6rem; background: rgba(0,0,0,0.7); color: white; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.7rem; }
    .trip-body { padding: 0.85rem; }
    .trip-route { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.5rem; }
    .trip-meta { display: flex; gap: 0.35rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
    .trip-meta span { background: var(--bg); padding: 0.2rem 0.5rem; border-radius: 6px; }
    .trip-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .btn-reserve { flex: 1; background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0.7rem; font-weight: 700; cursor: pointer; }
    .btn-details { background: white; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; padding: 0.7rem; font-weight: 700; cursor: pointer; }
    .no-results { text-align: center; padding: 2rem; grid-column: 1 / -1; }

    /* ---------- Modal ---------- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; width: 100%; max-width: 520px; border-radius: var(--radius) var(--radius) 0 0; max-height: 92vh; overflow-y: auto; }
    .modal-header { padding: 1rem; background: var(--primary); color: white; display: flex; justify-content: space-between; }
    .modal-close { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
    .modal-body { padding: 1.1rem; display: flex; flex-direction: column; gap: 0.85rem; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .btn-confirm { background: var(--success); color: white; border: none; border-radius: 8px; padding: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 0.5rem; }
    .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }

    /* ---------- Toast ---------- */
    .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: white; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 2000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ---------- Responsive ---------- */
    @media (min-width: 600px) {
      .search-box { grid-template-columns: repeat(4, 1fr); }
      .search-box button { grid-column: auto; }
      .trips-grid { grid-template-columns: repeat(2, 1fr); }
      .modal-overlay { align-items: center; }
      .modal { border-radius: var(--radius); }
    }
    @media (min-width: 900px) {
      .trips-grid { grid-template-columns: repeat(3, 1fr); }
      .search-box { padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">🚌 Viajes Perdomo</div>
      <nav>
        <button class="active" data-view="trips">Viajes</button>
        <button data-view="mis-reservas">Mis Reservas</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Viaja cómodo por toda Cuba</h1>
    <p>Guaguas Yutong con aire acondicionado, WiFi y asientos reclinables.</p>

    <div class="search-box">
      <div class="field">
        <label>Origen</label>
        <select id="origen">
          <option value="">Cualquiera</option>
          <option>La Habana</option>
          <option>Varadero</option>
          <option>Santiago de Cuba</option>
          <option>Holguín</option>
          <option>Camagüey</option>
          <option>Trinidad</option>
          <option>Santa Clara</option>
        </select>
      </div>
      <div class="field">
        <label>Destino</label>
        <select id="destino">
          <option value="">Cualquiera</option>
          <option>La Habana</option>
          <option>Varadero</option>
          <option>Santiago de Cuba</option>
          <option>Holguín</option>
          <option>Camagüey</option>
          <option>Trinidad</option>
          <option>Santa Clara</option>
        </select>
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha" />
      </div>
      <div class="field">
        <label>Personas</label>
        <input type="number" id="personas" min="1" max="10" value="1" />
      </div>
      <button id="btn-buscar">🔍 Buscar guagua</button>
    </div>
  </section>

  <main>
    <div class="filters" id="filtros">
      <button class="chip active" data-filter="all">Todas</button>
      <button class="chip" data-filter="este">🛣️ Este</button>
      <button class="chip" data-filter="centro">🛣️ Centro</button>
      <button class="chip" data-filter="oeste">🛣️ Oeste</button>
      <button class="chip" data-filter="especial">⭐ Especiales</button>
    </div>

    <div class="trips-grid" id="trips-grid">
      <!-- Aquí se inyectarán las guaguas desde el servidor -->
    </div>
  </main>

  <!-- MODAL RESERVA -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-titulo">Reservar</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-summary" style="background:#f8fafc; padding:0.8rem; border-radius:8px; margin-bottom:0.5rem;"></div>

        <div class="row-2">
          <div class="field">
            <label>Nombre completo</label>
            <input type="text" id="nombre" required />
          </div>
          <div class="field">
            <label>Carnet de identidad</label>
            <input type="text" id="ci" required />
          </div>
        </div>

        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="email" required />
        </div>

        <div class="row-2">
          <div class="field">
            <label>Teléfono</label>
            <input type="tel" id="telefono" required />
          </div>
          <div class="field">
            <label>Fecha del viaje</label>
            <input type="date" id="fecha-reserva" required />
          </div>
        </div>

        <div class="field">
          <label>Cantidad de pasajeros</label>
          <input type="number" id="cantidad" min="1" max="10" value="1" />
        </div>

        <button class="btn-confirm" id="btn-confirmar">✅ Confirmar reserva</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       ESTADO Y CONEXIÓN AL BACKEND
       ========================================================= */
    let GUAGUAS = []; // Se llenará desde la API
    let MIS_RESERVAS = []; // Simulamos guardar las reservas del cliente en memoria

    const state = {
      filtro: 'all',
      busqueda: { origen: '', destino: '' },
      viajeSeleccionado: null,
      vista: 'trips'
    };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const formatoPrecio = (precio, moneda) => {
      if (moneda === 'MLC') return `${precio.toFixed(2)} MLC`;
      return `${precio.toLocaleString('es-CU')} CUP`;
    };

    function mostrarToast(mensaje, tipo = 'success') {
      const toast = $('#toast');
      toast.textContent = mensaje;
      toast.style.background = tipo === 'success' ? 'var(--success)' : 'var(--danger)';
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    /* =========================================================
       CARGA DE DATOS DESDE EL SERVIDOR (RENDER)
       ========================================================= */
    async function cargarGuaguas() {
      try {
        const res = await fetch('/api/guaguas');
        GUAGUAS = await res.json();
        renderViajes();
      } catch (error) {
        console.error("Error cargando guaguas:", error);
        $('#trips-grid').innerHTML = `<div class="no-results">Error de conexión con el servidor. Intenta recargar.</div>`;
      }
    }

    /* =========================================================
       RENDERIZADO
       ========================================================= */
    function renderViajes() {
      const grid = $('#trips-grid');
      const { filtro, busqueda } = state;

      if (state.vista === 'mis-reservas') {
        renderReservas();
        return;
      }

      // Filtrar guaguas
      let lista = GUAGUAS.filter(v => {
        if (!v.activa) return false; // Solo mostrar activas
        if (filtro !== 'all' && v.region.toLowerCase() !== filtro) return false;
        if (busqueda.origen && v.origen !== busqueda.origen) return false;
        if (busqueda.destino && v.destino !== busqueda.destino) return false;
        return true;
      });

      if (lista.length === 0) {
        grid.innerHTML = `<div class="no-results"><span style="font-size:2rem">🔍</span><br>No hay guaguas disponibles con estos filtros.</div>`;
        return;
      }

      grid.innerHTML = lista.map(v => `
        <article class="trip-card">
          <div class="trip-img" style="background-image:url('${v.imagen || 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957'}')">
            ${v.oferta ? '<span style="background:red;color:white;padding:0.2rem 0.5rem;border-radius:4px;font-size:0.7rem;font-weight:bold;">OFERTA</span>' : '<span></span>'}
            <span class="trip-price">${formatoPrecio(v.precio, v.moneda)}</span>
            <span class="badge-guagua">🚌 ${v.unidad}</span>
          </div>
          <div class="trip-body">
            <div class="trip-route">
              ${v.origen} → ${v.destino}
              <div style="font-size: 0.8rem; color: var(--primary); font-weight: 600;">Salida ${v.salida} · ${v.duracion}</div>
            </div>
            <div class="trip-meta">
              <span>🪑 ${v.asientosDisp} disponibles</span>
            </div>
            <p style="font-size:0.85rem; color:#666; margin-bottom:0.5rem;">${v.descripcion}</p>
            <div class="trip-actions">
              <button class="btn-reserve" data-id="${v.id}" ${v.asientosDisp <= 0 ? 'disabled style="background:#ccc"' : ''}>
                ${v.asientosDisp > 0 ? 'Reservar' : 'Agotado'}
              </button>
            </div>
          </div>
        </article>
      `).join('');

      grid.querySelectorAll('.btn-reserve').forEach(btn => {
        if(!btn.disabled) {
          btn.addEventListener('click', () => abrirModal(btn.dataset.id));
        }
      });
    }

    function renderReservas() {
      const grid = $('#trips-grid');
      if (MIS_RESERVAS.length === 0) {
        grid.innerHTML = `<div class="no-results"><span style="font-size:2rem">🎒</span><br>Aún no tienes reservas en esta sesión.</div>`;
        return;
      }

      grid.innerHTML = MIS_RESERVAS.map(r => `
        <article class="trip-card">
          <div class="trip-body">
            <div class="trip-route">${r.origen} → ${r.destino}</div>
            <div class="trip-meta">
              <span>📅 ${r.fechaViaje}</span>
              <span>👤 ${r.nombre}</span>
            </div>
            <div style="margin-top:0.5rem; border-top:1px solid #eee; padding-top:0.5rem;">
              <p>Total: <strong>${formatoPrecio(r.total, r.moneda)}</strong></p>
              <p>Código: <strong>${r.codigo}</strong></p>
            </div>
          </div>
        </article>
      `).join('');
    }

    /* =========================================================
       MODAL Y RESERVA
       ========================================================= */
    function abrirModal(id) {
      const viaje = GUAGUAS.find(v => v.id === id);
      if (!viaje) return;
      state.viajeSeleccionado = viaje;

      $('#modal-titulo').textContent = `${viaje.origen} → ${viaje.destino}`;
      $('#modal-summary').innerHTML = `
        <p><strong>🚌 Guagua:</strong> ${viaje.unidad}</p>
        <p><strong>💵 Precio:</strong> ${formatoPrecio(viaje.precio, viaje.moneda)} c/u</p>
      `;

      $('#cantidad').max = viaje.asientosDisp;
      $('#cantidad').value = 1;
      $('#modal').classList.add('open');
    }

    function cerrarModal() {
      $('#modal').classList.remove('open');
      state.viajeSeleccionado = null;
    }

    async function confirmarReserva() {
      const v = state.viajeSeleccionado;
      if (!v) return;

      const nombre = $('#nombre').value.trim();
      const ci = $('#ci').value.trim();
      const email = $('#email').value.trim();
      const telefono = $('#telefono').value.trim();
      const fechaViaje = $('#fecha-reserva').value;
      const cantidad = parseInt($('#cantidad').value) || 1;

      if (!nombre || !ci || !email || !telefono || !fechaViaje) {
        mostrarToast('Completa todos los campos', 'error');
        return;
      }

      const btn = $('#btn-confirmar');
      btn.disabled = true;
      btn.textContent = 'Procesando...';

      try {
        // Enviar datos al backend (Render)
        const res = await fetch('/api/reservas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre, ci, email, telefono, 
            guaguaId: v.id, 
            fechaViaje, 
            cantidad
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al reservar');
        }

        // Guardar en la lista local para mostrar en "Mis Reservas"
        MIS_RESERVAS.push({
          ...data,
          origen: v.origen,
          destino: v.destino
        });

        mostrarToast(`¡Reserva exitosa! Código: ${data.codigo}`);
        cerrarModal();
        
        // Recargar guaguas para actualizar los asientos disponibles
        cargarGuaguas();

      } catch (error) {
        mostrarToast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '✅ Confirmar reserva';
      }
    }

    /* =========================================================
       EVENTOS DE LA INTERFAZ
       ========================================================= */
    $('#filtros').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      $$('#filtros .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.filtro = chip.dataset.filter;
      renderViajes();
    });

    $('#btn-buscar').addEventListener('click', () => {
      state.busqueda = {
        origen: $('#origen').value,
        destino: $('#destino').value
      };
      state.vista = 'trips';
      $$('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === 'trips'));
      renderViajes();
    });

    $$('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.vista = btn.dataset.view;
        $('#filtros').style.display = state.vista === 'trips' ? 'flex' : 'none';
        renderViajes();
      });
    });

    $('#modal-close').addEventListener('click', cerrarModal);
    $('#btn-confirmar').addEventListener('click', confirmarReserva);

    /* =========================================================
       INICIALIZACIÓN
       ========================================================= */
    // Cargar las guaguas ni bien abre la página
    cargarGuaguas();
  </script>
</body>
</html>
